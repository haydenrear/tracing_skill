[observability]
service_name = "orders-api"
service_version = "0.1.0"
otlp_endpoint = "http://cdc-commit-diff-context-otel-collector.cdc.svc:4318"
log_level = "INFO"
metrics_enabled = true
# The host gateway is localhost:4318; pods use host.k3d.internal:4318.
metrics_export_interval_seconds = 15.0
# metrics_port starts a local Prometheus debugging endpoint. Production
# metrics are pushed over OTLP and are not scraped from this endpoint.
# metrics_port = 9464
# metrics_addr = "0.0.0.0"
