[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tracing-skill-observability"
version = "0.3.0"
description = "Structured logging, OpenTelemetry tracing, and native OpenTelemetry metrics for Python services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-otlp-proto-http>=1.25.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
fastapi = ["opentelemetry-instrumentation-fastapi>=0.46b0"]
requests = ["opentelemetry-instrumentation-requests>=0.46b0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tracing_skill_observability"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
